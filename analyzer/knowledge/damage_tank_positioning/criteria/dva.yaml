- id: dva.positioning.height_control
  category: positioning
  status: draft
  ability: null
  title: 고지대 거부와 아군 활용
  description: '적용 상황: 적 딜러가 고지대 사용. 평가 목적: 고지대 거부와 아군 활용. 예외: 목표물 접촉·다른 급한 위협은 우선 가능. 필수 근거: 고지대 적·아군 활용·거점 상태.
    결정 당시의 정보와 실행 가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
  good_signs:
  - 적을 밀어내고 아군이 쓸 수 있는 공간 유지
  bad_signs:
  - 당장 피해가 적다고 유효 고지대를 무조건 포기
  cannot_judge_when:
