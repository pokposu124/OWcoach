  description: '적용 상황: 측면 준비 완료. 평가 목적: 아군 교전과 겹치는 측면 공격. 예외: 고립 적에게 안전한 기습은 예외. 필수 근거: 아군 공격·적 시선·자원. 결정 당시의 정보와
