  description: '적용 상황: 근접 진입 준비. 평가 목적: 검 사거리까지 접근할 엄폐. 예외: 거점 접촉이 급하면 위험 비교. 필수 근거: 접근·아군 사선·에너지. 결정 당시의 정보와 실행
    가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
