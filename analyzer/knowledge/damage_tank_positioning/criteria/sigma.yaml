  description: '적용 상황: 중거리 교전. 평가 목적: 초구체 유효 거리와 접근 대응. 예외: 아군 후속으로 접근 적을 제거할 수 있으면 유지. 필수 근거: 적 접근·거리 근거·퇴로. 결정
    당시의 정보와 실행 가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
