  title: 진입 전 근접 엄폐에서 준비
  description: '적용 상황: 다이브 준비. 평가 목적: 진입 전 근접 엄폐에서 준비. 예외: 긴급 접촉은 준비 생략 가능. 필수 근거: 체력·기술·목표·아군 타이밍. 결정 당시의 정보와 실행
    가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
