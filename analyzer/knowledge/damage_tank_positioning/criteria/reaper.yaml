  title: 근접 화력을 위한 엄폐 접근
  description: '적용 상황: 근거리 진입 전. 평가 목적: 근접 화력을 위한 엄폐 접근. 예외: 안전한 접근이 없으면 견제 유지. 필수 근거: 경로·적 사선·자원. 결정 당시의 정보와 실행
    가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
