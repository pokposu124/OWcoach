- id: cassidy.positioning.effective_angle
  category: positioning
  status: draft
  ability: null
  title: 유효 거리에서 유지할 짧은 측면
  description: '적용 상황: 중거리 교전. 평가 목적: 유효 거리에서 유지할 짧은 측면. 예외: 고립 적 마무리의 이득은 비교. 필수 근거: 대상 거리 근거·엄폐·복귀. 결정 당시의 정보와
    실행 가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
  good_signs:
  - 엄폐와 아군 도움을 유지하며 측면 압박
  bad_signs:
  - 빠져나올 수 없는 깊은 측면 진입
  cannot_judge_when:
  - '핵심 근거 미확인: 대상 거리 근거·엄폐·복귀'
  - 카메라 밖 상태·스킬 명중·효과·아군 후속·실행 가능한 대안을 추정으로만 채워야 함
  - 패치·모드·형태·특전 차이가 판정을 바꾸는데 해당 차이를 확인하지 못함
