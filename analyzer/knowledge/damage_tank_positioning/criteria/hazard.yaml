  title: 지형을 이용한 짧은 도약 진입
  description: '적용 상황: 근접 교전 준비. 평가 목적: 지형을 이용한 짧은 도약 진입. 예외: 거점 접촉·확실한 후속이면 비교. 필수 근거: 출발·도착·지원선·적 위치. 결정 당시의 정보와
    실행 가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
