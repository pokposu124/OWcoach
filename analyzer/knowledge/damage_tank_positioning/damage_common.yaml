- id: damage.positioning.angle
  category: positioning
  status: draft
  ability: null
  title: 한 방어 방향으로 모두 막히지 않는 공격각
  description: '적용 상황: 팀과 같은 적을 압박. 평가 목적: 한 방어 방향으로 모두 막히지 않는 공격각. 예외: 정면 집중 공격이 가장 유효하면 합류 가능. 필수 근거: 아군·적 사선·엄폐·압박
    결과. 결정 당시의 정보와 실행 가능한 대안을 비교한다. 나쁜 신호 하나만으로 블런더를 확정하지 않는다.'
  good_signs:
  - 엄폐·후퇴를 갖춘 별도 각도로 적 주의 분산
  bad_signs:
  - 본대와 다른 곳에 있지만 적에게 영향도 없음
  cannot_judge_when:
  - '핵심 근거 미확인: 아군·적 사선·엄폐·압박 결과'
  - 카메라 밖 상태·스킬 명중·효과·아군 후속·실행 가능한 대안을 추정으로만 채워야 함
  - 패치·모드·형태·특전 차이가 판정을 바꾸는데 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: sources.yaml -> references; C01, C13; 세부 조건·예외는 작성자 설계
    patch_version: null
