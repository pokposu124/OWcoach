- id: mizuki.positioning.aura_or_lane
  category: positioning
  status: draft
  ability: null
  title: 오라 수혜와 측면 통제를 함께 평가
  description: '적용 상황: 본대와 측면 중 위치를 선택. 평가: 오라 수혜와 측면 통제를 함께 평가. 예외: 짧은 공격 후 복귀 계획이 있으면 일시적 오라 이탈도 유효함. 필수
    근거: 아군 배치·치료 연결·적 진입로·측면 압박 효과. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 아군이 오라·모자 치료를 활용하거나 딜러와 함께 적 진입로를 통제함
  bad_signs:
  - 오라 때문에 무조건 뭉치거나 반대로 혼자 멀어져 치료와 측면 통제 모두 잃음
  cannot_judge_when:
