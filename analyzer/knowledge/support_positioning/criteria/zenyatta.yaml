- id: zenyatta.positioning.early_rotation
  category: positioning
  status: draft
  ability: null
  title: 위협이 닿기 전 엄폐 간 이동
  description: '적용 상황: 적이 접근하거나 전선이 이동. 평가: 위협이 닿기 전 엄폐 간 이동. 예외: 교전이 곧 끝나거나 거점 접촉이 필요한 경우 체류 가치도 평가. 필수 근거:
    적 접근·이동 시작·엄폐 경로·아군 위치. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 이동기가 없는 점을 고려해 치료·공격 시야가 이어지는 엄폐로 미리 이동함
  bad_signs:
  - 적 접근을 확인했는데 마지막 순간까지 열린 자리에서 사격하다 퇴로 상실
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 적 접근·이동 시작·엄폐 경로·아군 위치'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.zenyatta; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Zenyatta?oldid=401906'
    patch_version: null
