- id: mercy.positioning.beam_cover
  category: positioning
  status: draft
  ability: null
  title: 광선 유지와 본체 엄폐
  description: '적용 상황: 아군에게 광선을 연결 중. 평가: 광선 유지와 본체 엄폐. 예외: 연결을 복구하기 위한 짧은 노출이나 긴급 거점 접촉은 허용. 필수 근거: 광선 연결·본체와
    대상 위치·적 사선·엄폐. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 필요한 연결은 유지하면서 본체는 적 사선에서 숨길 위치 사용
  bad_signs:
  - 대상이 보인다는 이유로 같은 열린 사선에 서서 불필요하게 피격됨
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 광선 연결·본체와 대상 위치·적 사선·엄폐'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.mercy; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Mercy?oldid=402043'
    patch_version: null
