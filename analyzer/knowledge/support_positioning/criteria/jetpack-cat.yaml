- id: jetpack-cat.positioning.aerial_cover
  category: positioning
  status: draft
  ability: null
  title: 비행 높이보다 공중 엄폐 경로
  description: '적용 상황: 공중에서 치료와 공격을 수행. 평가: 비행 높이보다 공중 엄폐 경로. 예외: 짧은 시야 확보나 안전한 운송 경로에 필요한 상승은 허용. 필수 근거: 비행
    경로·건물 가림·적 사선·지원 대상. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 건물·모서리를 이용해 적 사선을 줄이며 필요한 대상을 볼 수 있음
  bad_signs:
  - 아무 장애물 없는 높이에 오래 떠서 여러 적에게 사격받음
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 비행 경로·건물 가림·적 사선·지원 대상'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.jetpack-cat; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Jetpack_Cat?oldid=403999'
    patch_version: null
