- id: ana.positioning.care_angle
  category: positioning
  status: draft
  ability: null
  title: 치료 시야와 엄폐를 함께 유지
  description: '적용 상황: 아군이 적과 교전하며 치료가 필요한 상황. 평가: 치료 시야와 엄폐를 함께 유지. 예외: 거점 접촉이나 즉각적인 구조를 위한 짧은 노출은 필요할 수 있음.
    필수 근거: 아군 위치·치료 시야·적 사선·대체 엄폐. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 엄폐 가장자리에서 필요한 아군에게 사격할 수 있고 적 측면 사선은 제한됨
  bad_signs:
  - 더 안전한 치료 각도가 보이는데 중앙으로 나와 여러 적에게 노출됨
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 아군 위치·치료 시야·적 사선·대체 엄폐'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.ana; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Ana?oldid=403928'
    patch_version: null
