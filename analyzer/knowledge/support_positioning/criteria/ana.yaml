  title: 탱커 전진에 맞춘 단계적 이동
  description: '적용 상황: 탱커가 모서리를 돌아 기존 위치에서 지원이 끊기려는 상황. 평가: 탱커 전진에 맞춘 단계적 이동. 예외: 탱커의 단독 무리한 진입이나 이동 경로의 적
