- id: illari.positioning.pylon_triangle
  category: positioning
  status: draft
  ability: null
  title: 본인·아군·태양석의 지원 연결
  description: '적용 상황: 태양석을 중심으로 교전. 평가: 본인·아군·태양석의 지원 연결. 예외: 다른 지원가가 치료를 맡거나 짧은 마무리 각도를 여는 경우 별도 판단. 필수 근거:
    본인·태양석·아군 위치·치료 효과·다른 지원. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 본인은 적을 압박할 각도를 가지면서 필요한 아군은 태양석 치료를 받을 수 있음
  bad_signs:
  - 본인만 안전한 측면을 잡고 태양석도 아군에게 닿지 않아 치료 공백 발생
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 본인·태양석·아군 위치·치료 효과·다른 지원'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.illari; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Illari?oldid=401817'
