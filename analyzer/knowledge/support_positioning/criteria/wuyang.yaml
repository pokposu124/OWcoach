criteria:
- id: wuyang.positioning.wave_alignment
  category: positioning
  status: draft
  ability: null
  title: 아군 지원과 파도 경로를 열어 두기
  description: '적용 상황: 아군이 정면 또는 측면에서 교전. 평가: 아군 지원과 파도 경로를 열어 두기. 예외: 아군이 안전하면 짧은 공격 각도로 적을 압박하는 것이 가능함. 필수
    근거: 아군 위치·파도 경로·적 접근·다른 지원. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 치료 대상과 적 진입을 함께 볼 수 있고 필요한 파도를 보낼 각도 확보
  bad_signs:
  - 너무 먼 측면에 남아 아군 구조와 진입 방해 모두 연결되지 않음
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 아군 위치·파도 경로·적 접근·다른 지원'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.wuyang; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Wuyang?oldid=401819'
    patch_version: null
