  title: 유도 공격 중 주변 확인
  description: '적용 상황: 공격 투사체를 유도하는 동안 교전 변화 발생. 평가: 유도 공격 중 주변 확인. 예외: 아군이 안전하고 공격이 중요한 위협을 제거할 기회면 유도 유지
    가능. 필수 근거: 유도 구간·아군 체력·적 접근 신호·지원 전환. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
