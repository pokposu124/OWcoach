  category: skill_usage
  status: draft
  ability: infuse
  title: 강화의 다음 사용처 선택
  description: '적용 상황: 강화를 사용하고 다음 행동을 결정. 평가: 강화의 다음 사용처 선택. 예외: 강화를 드론에만 쓰거나 항상 하나를 남기라는 고정 규칙은 적용하지 않음.
    필수 근거: 강화 발동·직후 사용 기술·자원·위협과 수혜자. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 응급 치료·공격·자기 생존 중 실제 필요에 맞는 행동에 연결함
