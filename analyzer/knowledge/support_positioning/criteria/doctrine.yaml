- id: doctrine.ultimate_usage.deliverance_window
  category: ultimate_usage
  status: draft
  ability: deliverance
  title: 궁극기를 교전 공간과 연결
  description: '적용 상황: 아군과 적이 같은 공간을 두고 싸움. 평가: 궁극기를 교전 공간과 연결. 예외: 즉각적인 구조·퇴각 지원도 후보이며 지속시간 기반 확정 평가는 금지.
    필수 근거: 궁 효과 대상·아군 후속·적 퇴로·해당 경기 패치와 검수된 효과. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 아군이 이득을 활용하고 적은 쉽게 벗어나기 어려운 교전 시점에 사용함
  bad_signs:
