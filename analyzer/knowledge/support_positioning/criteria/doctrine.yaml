criteria:
- id: doctrine.positioning.support_distance
  category: positioning
  status: draft
  ability: null
  title: 중거리 지원과 구조받을 거리
  description: '적용 상황: 아군이 전진하며 교전. 평가: 중거리 지원과 구조받을 거리. 예외: 고립된 적을 안전하게 압박할 짧은 각도는 허용. 필수 근거: 아군 이동·치료 시야·적
    접근·복귀 경로. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 치료 시야를 유지하면서 압박받으면 아군 쪽으로 돌아갈 수 있음
  bad_signs:
  - 이동이 빠른 아군을 끝까지 따라가 고립되거나 너무 멀어 지원이 끊김
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 아군 이동·치료 시야·적 접근·복귀 경로'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.doctrine; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Doctrine?oldid=404989'
    patch_version: null
- id: doctrine.positioning.infused_exit
  category: positioning
  status: draft
  ability: null
  title: 강화 이동을 포함한 탈출 계획
  description: '적용 상황: 적 다이버가 접근 가능한 상태. 평가: 강화 이동을 포함한 탈출 계획. 예외: 강화 공격이나 지원이 즉시 교전을 끝낼 수 있으면 자원 투자 가능. 필수
    근거: 강화 잔량·이동 HUD·적 접근·도착 가능 공간. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
