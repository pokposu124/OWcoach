- id: baptiste.positioning.dual_lane
  category: positioning
  status: draft
  ability: null
  title: 치유 탄착점과 공격 사선을 함께 확보
  description: '적용 상황: 아군이 지상에서 교전하는 상황. 평가: 치유 탄착점과 공격 사선을 함께 확보. 예외: 다른 지원가가 치료를 담당하고 안전한 공격 기회가 있으면 별도 각도
    가능. 필수 근거: 치유 투사체 경로·아군 체력·다른 지원·적 사선. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 엄폐에서 아군 주변 지면과 공격할 적을 번갈아 볼 수 있음
  bad_signs:
  - 치료 탄 경로가 막힌 측면에 오래 남아 위급한 아군을 지원하지 못함
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 치유 투사체 경로·아군 체력·다른 지원·적 사선'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.baptiste; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Baptiste?oldid=404928'
    patch_version: null
