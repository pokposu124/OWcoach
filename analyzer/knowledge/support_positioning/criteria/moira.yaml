criteria:
- id: moira.positioning.healing_reach
  category: positioning
  status: draft
  ability: null
  title: 아군을 치료할 위치와 안전한 접근
  description: '적용 상황: 아군이 근거리 교전을 진행. 평가: 아군을 치료할 위치와 안전한 접근. 예외: 아군의 무리한 진입이나 위험한 통로 때문에 접근 불가하면 추격 의무 없음.
    필수 근거: 치료 연결·아군 피해·접근 경로·적 사선. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 치료가 닿는 위치를 유지하면서 적 정면 노출을 엄폐로 줄임
  bad_signs:
  - 안전하게 접근할 수 있는데 너무 멀리 남아 위급한 아군을 치료하지 못함
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 치료 연결·아군 피해·접근 경로·적 사선'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.moira; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Moira?oldid=404012'
    patch_version: null
