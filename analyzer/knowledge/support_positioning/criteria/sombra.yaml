- id: sombra.positioning.rework_role
  category: positioning
  status: draft
  ability: null
  title: 지원형 솜브라의 교전 연결
  description: '적용 상황: 지원 역할로 개편된 스킬 구성이 확인된 경기. 평가: 지원형 솜브라의 교전 연결. 예외: 고립된 핵심 적 제거나 거점 압박이 더 큰 이득을 만들면 일시적
    이탈 가능. 필수 근거: 경기 패치·스킬 구성·아군 피해·지원 기술의 실제 연결. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 짧은 측면 압박 중에도 Hotfix와 Cyberspace로 필요한 아군을 지원함
  bad_signs:
  - 과거 공격 역할처럼 장시간 단독 잠입해 팀 지원 기회를 잃음
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 경기 패치·스킬 구성·아군 피해·지원 기술의 실제 연결'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.sombra; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Sombra?oldid=404978'
    patch_version: null
