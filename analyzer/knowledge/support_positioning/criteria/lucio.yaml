criteria:
- id: lucio.positioning.aura_assignment
  category: positioning
  status: draft
  ability: null
  title: 오라를 받을 아군과 자신의 역할 결정
  description: '적용 상황: 팀이 진입·철수·견제 중. 평가: 오라를 받을 아군과 자신의 역할 결정. 예외: 적 저격수 압박·거점 지연·후방 보호가 더 가치 있으면 본대 이탈 가능.
    필수 근거: 오라 수혜자·팀 이동 의도 근거·이탈 중 기여. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 이동 지원이나 보호가 필요한 아군 근처에서 오라를 연결함
  bad_signs:
  - 개인 추격 때문에 이동이 필요한 아군을 반복해서 지원하지 못함
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 오라 수혜자·팀 이동 의도 근거·이탈 중 기여'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.lucio; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/L%C3%BAcio?oldid=401574'
    patch_version: null
