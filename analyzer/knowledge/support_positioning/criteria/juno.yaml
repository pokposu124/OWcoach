criteria:
- id: juno.positioning.working_range
  category: positioning
  status: draft
  ability: null
  title: 치료가 실질적으로 연결되는 중거리
  description: '적용 상황: 아군을 치료하며 원거리 안전을 추구. 평가: 치료가 실질적으로 연결되는 중거리. 예외: 접근 경로가 저격이나 다이브에 노출되면 거리 유지가 타당함. 필수
    근거: 거리 근거·치료 효과·아군 피해·경기 패치의 거리 관련 규칙. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 엄폐와 치료 효율을 함께 유지할 위치로 따라 이동함
  bad_signs:
  - 필요 이상으로 멀어져 치료 기여가 떨어지는데 안전한 접근 경로를 쓰지 않음
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 거리 근거·치료 효과·아군 피해·경기 패치의 거리 관련 규칙'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.juno; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Juno?oldid=402632'
    patch_version: null
