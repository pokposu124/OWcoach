- id: kiriko.positioning.off_angle_contract
  category: positioning
  status: draft
  ability: null
  title: 측면 압박과 치료 복귀 조건
  description: '적용 상황: 측면에서 쿠나이로 압박. 평가: 측면 압박과 치료 복귀 조건. 예외: 다른 지원가가 충분히 담당하거나 결정적 위협을 제거하는 경우 측면 유지 가능. 필수
    근거: 아군 체력·다른 지원·측면 길이·복귀 경로. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 아군이 버틸 상황에서 짧게 압박하고 치료 필요가 커지면 복귀함
  bad_signs:
  - 아군 치료 공백이 확인됐는데 깊은 측면에서 공격만 지속함
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 아군 체력·다른 지원·측면 길이·복귀 경로'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.kiriko; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Kiriko?oldid=404784'
    patch_version: null
