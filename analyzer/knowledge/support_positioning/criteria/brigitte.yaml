- id: brigitte.positioning.peel_anchor
  category: positioning
  status: draft
  ability: null
  title: 보호할 아군과 적 진입로 사이 연결
  description: '적용 상황: 다이브 위협이 있는 교전. 평가: 보호할 아군과 적 진입로 사이 연결. 예외: 아군이 안전하고 측면 딜러와 함께 공간을 확보할 수 있으면 전진 가능.
    필수 근거: 아군 위치·적 접근로·전진 후 지원 공백. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 취약한 아군을 도울 거리에서 적 진입을 방해하면서 엄폐 사용
  bad_signs:
  - 적 탱커를 쫓아가 보호 대상과 단절되고 뒤쪽 다이브를 방치함
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 아군 위치·적 접근로·전진 후 지원 공백'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.brigitte; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Brigitte?oldid=403761'
    patch_version: null
