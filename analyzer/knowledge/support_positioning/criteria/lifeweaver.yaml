- id: lifeweaver.positioning.grip_destination
  category: positioning
  status: draft
  ability: null
  title: 구출받을 아군이 도착할 위치 확보
  description: '적용 상황: 구원의 손길 사용 가능 상태로 교전 지원. 평가: 구출받을 아군이 도착할 위치 확보. 예외: 즉시 치명적 위험에서 벗어나는 것만으로 가치가 있으면 완벽하지
    않은 도착점도 허용. 필수 근거: 본인 위치·도착 예상 공간·적 사선·대상의 원래 위험. 예외·실행 가능한 대안을 확인한 뒤 판단하며 결과만으로 결정하지 않는다.'
  good_signs:
  - 치료 시야와 함께 아군이 끌려와도 안전한 엄폐 공간을 확보함
  bad_signs:
  - 본인 위치가 적 사선 안인데 구조 대상도 같은 위험으로 끌어옴
  cannot_judge_when:
  - '다음 근거의 핵심 요소를 확인할 수 없음: 본인 위치·도착 예상 공간·적 사선·대상의 원래 위험'
  - 사용 여부만 확인되고 대상·도달·당시 위협 또는 필요한 대안 경로가 불명확함
  - 경기 패치·모드·특전 차이가 이 판정에 영향을 주지만 해당 차이를 확인하지 못함
  source:
    type: editorial_synthesis
    reference: 'sources.yaml -> heroes.lifeweaver; 전술은 검수 전 작성자 설계. 메커니즘 참조: https://overwatch.weirdgloop.org/w/Lifeweaver?oldid=404925'
    patch_version: null
