# 모든 영웅에 공통으로 적용하는 코칭 지식. load_hero() 가 각 영웅 기준에 합친다.
# 영웅과 무관하게 성립하는 판단(적 영웅의 방어 스킬에 대한 대응 등)만 둔다.
# 형식은 heroes/<hero>.yaml 의 observable_signals / criteria 와 같다. criterion id 는 common. 으로 시작한다.
common_version: "0.4.0"

# 적이 막거나 되돌리는 스킬. 플레이어 스킬 사용 순간마다 이 중 하나가 그 방향에서 켜져 있었는지 따로 확인한다(moment 단계).
skill_counters:
  - "겐지 튕겨내기 (칼을 앞으로 세워 막는 자세, 날아오는 투사체가 되돌아감)"

# 코치의 조합 메모. 아군 조합이 team 과 min_match 명 이상 같으면(versus 가 있으면 적 조합도) 분석 프롬프트에 넣는다.
# 영웅 이름은 config/hero_portraits/portraits.yaml 의 이름과 같게 쓴다.
comp_notes:
  - team: ["시그마", "위도우메이커", "솔저: 76", "독트린", "아나"]
    note: >
      대치(포킹) 조합. 킬을 낼 수 있는 건 위도우메이커뿐이라, 위도우의 변수를 믿고 죽지 않는 선에서 대치하는 조합이다.
    source: "외부 코치 피드백 2026-10-14, 첫 번째 아나 영상 0:16"
  - team: ["시그마", "위도우메이커", "솔저: 76", "독트린", "아나"]
    versus: ["D.Va", "주노", "라이프위버", "소전", "시에라"]
    note: >
      대치했을 때의 힘싸움은 아군 조합이 월등히 좋다. 죽지 않는 선에서 대치만 해도 상대가 밀려나 화물을 계속 밀 수 있다.
      위도우가 파라로, 상대 위버가 모이라로 바뀐 뒤에도 대치 힘싸움은 아군이 유리했다(코치 판단).
    source: "외부 코치 피드백 2026-10-14, 첫 번째 아나 영상 0:43, 1:28, 2:50"

observable_signals:
  - "아군 탱커의 위치: 플레이어보다 앞으로 나갔는지, 플레이어 시야·치유 사거리 안에 있는지"
  - "화물(호위 맵) 진행 여부: 화물이 움직이는지, 화물 근처에 아군이 있는지"
  - "적 D.Va 상태: 메카에 타고 있는지, 메카가 터져 본체(송하나)만 남았는지, 송하나의 체력"
  - "D.Va 자폭(메카가 빛나며 폭발 예고): 벽 뒤에 있거나 벽을 등지고 있으면 피해를 받지 않는다"
  - "적 겐지의 튕겨내기(칼을 앞으로 세워 막는 자세, 날아오는 공격이 튕겨 나감) 사용 여부와 시작·끝 시각"
  - "투사체 스킬(예: 생체 수류탄)의 대상은 날아간 궤적과 터진 위치로 판단한다. 체력이 오른 것만 보고 자기 발밑에 썼다고 단정하지 않는다 (아군 힐러의 회복일 수 있음, 사용자 확인: 두 번째 아나 영상 3분 41초)"

criteria:
  - id: common.skill.no_skills_into_deflect
    category: skill_usage
    status: draft
    title: "겐지 튕겨내기 중 스킬 사용 금지"
    description: >
      적 겐지가 튕겨내기를 쓰는 동안 그 겐지 쪽으로 스킬을 쓰면 대부분 되돌아오거나 낭비된다.
      튕겨내기가 끝날 때까지(약 2초) 스킬을 아끼고, 그 뒤에 쓴다. 모든 영웅에 해당한다.
    good_signs:
      - "적 겐지가 튕겨내기를 켜자 스킬 사용을 멈추고, 끝난 뒤 사용"
    bad_signs:
      - "적 겐지가 튕겨내기 중일 때 그 방향으로 스킬을 사용 (아나: 생체 수류탄, 수면총)"
    cannot_judge_when:
      - "적 겐지의 튕겨내기 사용 여부나 스킬을 쓴 방향이 화면에서 확인되지 않음"
    source:
      type: user_coaching
      reference: "사용자 코칭 2026-10-13: 두 번째 아나 영상 36초, 겐지 튕겨내기 중 생체 수류탄 = 블런더"
      patch_version: unverified

  - id: common.positioning.standoff_survival
    category: positioning
    status: draft
    title: "대치 우위 조합에서 죽지 않는 선 유지"
    description: >
      조합상 대치(서로 거리를 두고 싸우는) 힘싸움이 아군 쪽이 유리하면, 죽지 않는 선에서 대치만 유지해도
      상대가 밀려나 화물·거점이 진행된다. 이런 조합에서는 생존이 곧 이득이고, 무리한 진입으로 죽는 것이 가장 큰 손해다.
      조합 판단은 팀 구성의 '코치 조합 메모'가 있을 때만 근거로 쓴다.
    good_signs:
      - "대치 우위 조합에서 엄폐를 끼고 사거리를 유지하며 교전"
    bad_signs:
      - "대치 우위 조합인데 엄폐 없이 앞으로 나가거나 적 진영 쪽으로 깊이 들어가 집중 공격을 받음"
    cannot_judge_when:
      - "팀 구성에 해당 조합에 대한 코치 조합 메모가 없음"
    source:
      type: human_coach
      reference: "외부 코치 피드백 2026-10-14, 첫 번째 아나 영상 0:16, 0:43, 2:50"
      patch_version: unverified

  - id: common.positioning.punish_hana
    category: positioning
    status: draft
    title: "송하나(D.Va 본체) 처치 시도"
    description: >
      적 D.Va 메카가 터져 본체(송하나)만 남았을 때 아군이 잡지 못하고 있으면, 그 자체가 큰 기회다(상대가 탱커 없이 싸움).
      약간 무리해서라도 송하나를 잡으러 들어가는 판단을 본다. 방 안처럼 벽이 있는 곳에서는 벽을 등지거나 벽 뒤로
      피하면 자폭에 죽지 않으므로, 자폭을 두려워해 물러날 필요가 없다.
    good_signs:
      - "송하나가 남았을 때 벽을 등지거나 엄폐를 끼고 접근해 처치를 시도"
    bad_signs:
      - "아군이 송하나를 오래 못 잡고 있는데 멀리서 보고만 있음"
    cannot_judge_when:
      - "송하나나 D.Va 메카 상태가 화면에서 확인되지 않음"
    source:
      type: human_coach
      reference: "외부 코치 피드백 2026-10-14, 첫 번째 아나 영상 2:04, 2:30"
      patch_version: unverified

  - id: common.ultimate.use_when_needed
    category: ultimate_usage
    status: draft
    title: "필요할 때만 궁극기 사용"
    description: >
      궁극기는 목표(화물·거점) 상황이 요구할 때 쓴다. 화물이 아직 밀리지 않는 등 급하지 않은 상황에서,
      혼자 무리하게 들어간 아군을 살리려고 쓰는 것은 낭비다.
    good_signs:
      - "화물·거점을 걸고 싸우는 교전에서 사용"
    bad_signs:
      - "목표상 급하지 않은데 무리하게 진입한 아군 한 명을 위해 사용 (첫 아나 영상 4분 8초 솔저 76 나노)"
    cannot_judge_when:
      - "화물·거점 진행 상황이 화면에서 확인되지 않음"
    source:
      type: human_coach
      reference: "외부 코치 피드백 2026-10-14, 첫 번째 아나 영상 4:08"
      patch_version: unverified

