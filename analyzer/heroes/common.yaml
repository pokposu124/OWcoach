# 모든 영웅에 공통으로 적용하는 코칭 지식. load_hero() 가 각 영웅 기준에 합친다.
# 영웅과 무관하게 성립하는 판단(적 영웅의 방어 스킬에 대한 대응 등)만 둔다.
# 형식은 heroes/<hero>.yaml 의 observable_signals / criteria 와 같다. criterion id 는 common. 으로 시작한다.
common_version: "0.1.0"

observable_signals:
  - "적 겐지의 튕겨내기(칼을 앞으로 세워 막는 자세, 날아오는 공격이 튕겨 나감) 사용 여부와 시작·끝 시각"

criteria:
  - id: common.skill.no_skills_into_deflect
    category: skill_usage
    status: draft
    title: "겐지 튕겨내기 중 스킬 사용 금지"
    description: >
      적 겐지가 튕겨내기를 쓰는 동안 그 겐지 쪽으로 스킬을 쓰면 대부분 되돌아오거나 낭비된다.
      튕겨내기가 끝날 때까지(약 2초) 스킬을 아끼고, 그 뒤에 쓴다. 모든 영웅에 해당한다.
    good_signs:
      - "적 겐지가 튕겨내기를 켜자 스킬 사용을 멈추고, 끝난 뒤 사용"
    bad_signs:
      - "적 겐지가 튕겨내기 중일 때 그 방향으로 스킬을 사용 (아나: 생체 수류탄, 수면총)"
    cannot_judge_when:
      - "적 겐지의 튕겨내기 사용 여부나 스킬을 쓴 방향이 화면에서 확인되지 않음"
    source:
      type: user_coaching
      reference: "사용자 코칭 2026-10-13: 두 번째 아나 영상 36초, 겐지 튕겨내기 중 생체 수류탄 = 블런더"
      patch_version: unverified
