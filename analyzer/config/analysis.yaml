# 분석 파이프라인 설정. 모든 값은 코드 기본값 없이 여기서 관리한다.
# 이 파일의 내용(및 프롬프트/영웅 기준 버전)은 단계별 캐시 지문(fingerprint)에 포함되므로,
# 값을 바꾸면 영향을 받는 단계만 다시 실행된다.
pipeline_version: "0.1.0"

input:
  max_duration_seconds: 300        # 초기 범위: 최대 5분
  min_width: 1280                  # HUD 판독을 위한 최소 해상도
  min_height: 720
  # 최대 1920x1080. 판독 좌표는 1280x720 기준이고 판독마다 그 크기로 줄여 읽으므로 16:9면 해상도와 무관하게 같은 위치다.
  # 16:10·울트라와이드는 HUD 배치가 달라 받지 않는다. (1080p 확인: 두 영상을 1920x1080으로 키워 코드 판독이 720p와 같은지 대조)
  max_width: 1920
  max_height: 1080
  aspect_ratio: [16, 9]
  aspect_tolerance: 0.01
  max_file_size_mb: 2000
  allowed_extensions: [".mp4", ".mov", ".mkv", ".webm"]

preprocess:
  # 전체 흐름 분석용 업로드 사본(proxy). 원본과 타임라인이 동일하도록 자르지 않고 재인코딩만 한다.
  proxy:
    enabled: true
    max_height: 720
    crf: 28
    fps: 30
  evidence_frame_max_width: 1280   # 근거 프레임 JPEG 최대 폭

# 팀 판별: 영상 전체(저해상도)로는 상단 팀 목록의 작은 글씨를 읽지 못해 이름을 지어내는 문제가 있어(실측),
# 원본에서 몇 장의 프레임을 골라 팀 목록·플레이어 HUD·킬피드 영역만 잘라 확대한 이미지로 따로 판독한다.
team:
  enabled: true
  # 아군 색 = 좌하단 내 초상화 테두리 색 (코드 측정). 팀 색은 설정·관전 시점에 따라 달라 "빨강=적"을 가정할 수 없음
  # (실측: 두 아나 영상 모두 아군이 빨강/분홍, 적이 파랑/청록).
  player_portrait:
    reference_resolution: [1280, 720]
    x0: 10
    y0: 595
    w: 70
    h: 100
    frames: 12
    min_saturation: 0.6
    min_value: 0.6
    min_gap: 0.25
  frame_fractions: [0.35, 0.65]    # 영상 길이의 이 비율 시각 프레임 사용 (대기실·처치 화면을 피하려고 중간 구간)
  upscale: 2
  media_resolution: MEDIA_RESOLUTION_HIGH
  # 영웅은 모델이 아니라 코드가 판독한다: 팀 목록 초상화를 참고 초상화와 이미지 대조(owcoach/portraits.py).
  # 모델은 초상화 참고표를 줘도 MMG(독트린)를 실행마다 마우가/솜브라로 high 확신도로 답했다(실측).
  portraits: config/hero_portraits/portraits.yaml
  portrait_slots:                  # 팀 목록 초상화 영역 (1280x720, 숫자 % 표시를 피한 오른쪽 부분)
    y: 49
    h: 24
    w: 30
    left_x: [63, 133, 203, 273, 343]
    right_x: [935, 1005, 1075, 1145, 1215]
    # 초상화 대조용 프레임(영상 길이 비율). 사망 등으로 초상화가 흐려진 프레임이 있어 여러 장에서 가장 잘 맞는 점수를 쓴다.
    frame_fractions: [0.15, 0.3, 0.45, 0.6, 0.75, 0.9]
    scale_min: 0.30                # 참고 초상화 축소 배율 탐색 범위 (실측 최적 0.34~0.36)
    scale_max: 0.40
    scale_step: 0.02
    # 영웅 교체 추적: step 간격 프레임마다 판독, min_run 장 연속 같을 때만 인정(사망·이펙트로 한 장씩 오판독 실측).
    # 교체 시각은 두 판독 사이를 refine 간격으로 다시 봐서 좁힌다. (첫 아나 영상: 1분 21초경 위도우→파라, 2분 31초경 위버→모이라)
    timeline:
      step_seconds: 8.0
      min_run: 2
      refine_seconds: 2.0
    thresholds:                    # 실측: 정답 0.77~0.93, 2위 0.46~0.68
      high_score: 0.75
      high_margin: 0.15
      min_score: 0.6
      min_margin: 0.05             # 이보다 2위와 차이가 작으면 '불명'
  reference_resolution: [1280, 720]
  regions:                         # 1280x720 기준 x, y, w, h
    team_lists: {x: 0, y: 0, w: 1280, h: 110}
    player_hud: {x: 0, y: 570, w: 340, h: 150}
    kill_feed: {x: 900, y: 90, w: 380, h: 130}

overview:
  # 전체 영상에서 모델이 받는 초당 프레임 수(샘플링 간격 = 1/fps 초). Gemini 허용 범위 (0, 24]
  fps: 1.0
  media_resolution: null           # null이면 API 기본값. 예: MEDIA_RESOLUTION_LOW / MEDIUM / HIGH
  max_candidates: 8                # 모델이 고른 후보 장면 최대 개수 (사망·HUD 궁극기 장면은 별도, 항상 포함). CLI --max-scenes

detail:
  pre_seconds: 8.0                 # 후보 장면 시작 전 추가 분석 범위
  post_seconds: 4.0                # 후보 장면 종료 후 추가 분석 범위
  fps: 4.0                         # 후보 구간 재분석 샘플링
  media_resolution: null
  merge_gap_seconds: 2.0           # 확장된 구간끼리 이 간격 이하로 붙어 있으면 하나로 합침
  max_window_seconds: 40.0         # 합친 구간의 최대 길이

coaching:
  temperature: 0.2
  # 장면별 포지셔닝·필수 스킬 피드백이 빠지면 빠진 것을 알려 이 횟수만큼 다시 요청 (실측: 한 실행에서 포지셔닝 전부 누락)
  coverage_retries: 1

# HUD로 확인한 스킬 사용마다 앞뒤를 짧게 잘라 높은 fps로 그 순간 상황(대상, 적 대응 스킬 여부, 결과)을 따로 묻는다.
# 장면 단위 상세 분석(4fps, 20~40초)은 튕겨내기처럼 2초 남짓한 동작을 놓쳤다(실측).
moment_check:
  enabled: true
  pre_seconds: 1.0
  post_seconds: 1.0
  fps: 10.0
  skip_ultimate: true              # 아군 대상 궁극기(나노)는 대상 판별을 코드가 따로 함

# 검수 전 지식베이스 기준도 코칭 프롬프트에 '검수 전 참고'(review_status: draft)로 넣는다 (사용자 결정 2026-10-17).
# draft 기준만 근거로 한 피드백은 output.require_approved_criteria_for_assertive 에 따라 참고·보류로만 표시된다.
# covered_by: 이 지식베이스 기준이 다루는 기존 기준. 영웅 프로필에 그중 하나라도 있으면 지식베이스 기준은 넣지 않는다
# (지식베이스 README의 아나 대응표: 같은 실수를 두 번 감점하지 않음. P01은 cover_access와 같은 내용이라 추가).
knowledge_packs:
  - path: knowledge/support_positioning
    enabled: true
    hero_file: "criteria/{hero}.yaml"
    common_file: common_criteria.yaml
    covered_by:
      ana.positioning.care_angle: [ana.positioning.backline_angle, ana.positioning.cover_access]
      ana.positioning.rotation_window: [ana.positioning.follow_tank]
      ana.positioning.dive_spacing: [ana.positioning.disengage_on_pressure]
      ana.skill_usage.sleep_priority: [ana.skill.sleep_dart_usage]
      ana.skill_usage.grenade_pressure: [ana.skill.biotic_grenade_usage]
      ana.skill_usage.grenade_rescue: [ana.skill.biotic_grenade_usage]
      ana.ultimate_usage.nano_window: [ana.ultimate.nano_boost_usage]
      support.positioning.p01: [ana.positioning.cover_access]
      support.positioning.p02: [ana.positioning.face_team_while_moving]
      support.positioning.p08: [ana.positioning.face_team_while_moving]
      support.positioning.p09: [ana.positioning.face_team_while_moving]

# 플레이어 사망 직전 상황은 모델이 후보로 고르지 않아도 반드시 분석한다.
# 사망 시각 = (좌하단 체력 칸 10개가 min_seconds 이상 모두 비어 있는(체력 0) 구간의 시작) + (overview 타임라인에서
# model_keywords 가 들어간 사건). 사망 중에도 HUD는 그대로 보이고(사망 위치에서 관전), 체력 칸이 비고
# 초상화에 빨간 해골이 뜬다. 실측(두 번째 영상): 체력 0 구간 5번, 각 11~14초(부활 대기), 첫 영상은 0번.
# 사망마다 [사망 - pre_seconds, 사망] 구간을 상세 분석 장면에 넣고, 코칭 단계는 그 구간 피드백을 최소 1개 쓴다.
# 플레이어 사망마다 처치자 확인: 킬피드(우상단)와 '○○에게 죽음' 알림을 확대해 모델이 이름을 읽고, 코드가 적 팀 목록과 대조.
# (사용자: 두 번째 영상 1분 11초 킬피드 '라마트라 > 아나' = 겐지는 처치에 관여하지 않음)
# 게임 수치: data/overwatch_stats (Overwatch Wiki 수집본 2026-10-15, CC BY-NC-SA 3.0). 이 경기의 영웅·스킬만 조회해
# 코칭에 넘긴다(플레이어 영웅은 전체, 다른 영웅은 쿨타임 + brief_stats). 규칙은 data/overwatch_stats/CLAUDE_USAGE.md.
game_data:
  enabled: true
  path: null                       # null = data/overwatch_stats/overwatch.sqlite
  brief_stats: [duration]
  cooldown_tolerance_seconds: 1.0  # HUD 감지 간격이 기본 쿨타임보다 이만큼 이상 짧으면 경고

# 피드백 칸마다 그 시간대 킬피드: 장면마다 step 간격으로 킬피드를 확대해 모델이 줄을 옮겨 적고, 코드가 같은 줄을 합치고
# 이름을 팀 목록과 대조(아군/적, 그 시각의 영웅). 피드백 시간 ± item_pad 안의 줄을 그 칸에 붙인다.
kill_feed:
  enabled: true
  step_seconds: 2.0              # 킬피드 한 줄은 수 초 유지되므로 2초 간격이면 놓치지 않음
  tail_seconds: 2.0              # 장면 끝 뒤까지 (사망 직후 줄)
  merge_seconds: 8.0
  item_pad_seconds: 3.0
  reference_resolution: [1280, 720]
  upscale: 2
  media_resolution: null
  region: {x: 840, y: 95, w: 440, h: 190}

killer_check:
  enabled: true
  offsets_seconds: [0.5, 1.25]
  reference_resolution: [1280, 720]
  upscale: 2
  media_resolution: MEDIA_RESOLUTION_HIGH
  regions:
    kill_feed: {x: 840, y: 95, w: 440, h: 190}
    death_notice: {x: 440, y: 470, w: 400, h: 100}

death_check:
  enabled: true
  pre_seconds: 10.0
  health_bar:
    reference_resolution: [1280, 720]
    x0: 114
    y0: 619
    x1: 278
    y1: 638
    white_threshold: 200
    empty_ratio: 0.03               # 흰 체력 칸 비율이 이 미만이면 체력 0 (실측: 살아 있을 때 최소 0.10)
    fps: 2.0
    min_seconds: 3.0
  # 모델이 기록한 사망이 체력 0 구간(사망~부활) 안이거나 그 앞뒤 이 시간 안이면 같은 사망으로 합친다
  merge_seconds: 5.0
  model_keywords: ["사망", "처치당", "죽음", "부활 대기", "리스폰 대기"]

# 모델이 말한 스킬/궁극기 사용을 HUD 픽셀로 대조 (AI 없음). owcoach/hud.py 참고.
# 슬롯별 "준비됨(흰 타일/원판)" vs "쿨다운/충전 중" 상태만 판별한다. 숫자(쿨다운 초, 궁극기 %)는 읽지 않는다.
# 좌표는 기본 HUD 배치·HUD 크기 100%의 1280x720 기준. 실제 영상 1개(1280x720 녹화)로만 보정되었으므로
# 다른 해상도 비율/HUD 설정에서는 영역을 다시 확인해야 한다.
hud_check:
  enabled: true
  fps: 4.0                         # 장면 구간 HUD 샘플링
  reference_resolution: [1280, 720]
  white_threshold: 185             # RGB 최솟값이 이 값을 넘으면 '흰 픽셀'
  ready_ratio: 0.5                 # 영역 내 흰 픽셀 비율이 이 이상이면 준비 상태 (실측: 준비 0.70~0.87, 쿨다운 0.06~0.20)
  # 스킬 칸 흰 비율이 이 미만이면 그 칸은 판독 불가(쿨다운 종료 순간 칸이 깜빡임. 실측 쿨다운은 0.05 이상),
  # 스킬 칸이 모두 이 미만이면 HUD 가려짐(사망 화면 등)으로 보고 궁극기도 판단하지 않음
  hidden_ratio: 0.03
  hidden_check_slots: [ability_1, ability_2]
  # 이 횟수 연속 같은 상태일 때만 상태로 인정. 궁극기 원판 영역은 밝은 배경·섬광으로 최대 약 1.25초
  # 흰색이 되는 경우가 있어(실측) 준비 상태를 2초(8회) 이상 유지할 때만 인정한다.
  min_run_samples: {default: 2, ultimate: 8}
  search_seconds: 2.5              # 모델이 말한 시각 ±이 범위에서 준비→사용 전환을 찾음
  # 스킬 칸이 피격 효과(빨간 화면)로 물들면 흰 비율이 0.25~0.5로 애매하게 나온다: 이 범위는 준비도 쿨다운도 아닌 '모름'.
  # 쿨다운이 끝나자마자(1초 이내) 쓴 스킬은 준비 상태가 한 표본만 보이므로, 흰 비율 strong_ready_ratio 이상이면 한 표본도 준비로 인정.
  # 실측: 영상1 52.5초(0.70 한 표본, 앞뒤 0.33·피격), 영상2 3분 17.5초(0.69) 수류탄을 놓쳤음(화면 확인: 둘 다 실제 사용).
  # 바꾼 뒤 두 영상 수류탄 13→14, 9→10개 (기존 사용은 모두 유지, 수면총 변화 없음), 원본과 재인코딩본의 판독이 같아짐.
  # 아직 놓치는 것: 영상2 4분 25.5초 수류탄(준비 상태 0.5초 미만, 4fps 표본에 안 잡힘).
  ambiguous_slots: [ability_1, ability_2]
  ambiguous_band: [0.25, 0.5]
  strong_ready_ratio: 0.6
  # 강화형 스킬(나노 강화제) 대상: 받은 아군의 팀 목록 칸 초상화 위에 흰 위쪽 화살표가 몇 초간 올라간다.
  # 사용 직후 window_seconds 동안 각 아군 칸 초상화 윗부분의 흰 픽셀 비율이 직전 baseline 대비
  # min_increase 이상 오른 프레임을 세어, min_frames 이상이고 2위의 2배 이상인 칸을 대상으로 본다.
  # 실측(136초 나노 → 목포산아이): 대상 칸 12프레임 중 9, 다른 칸 0~1.
  buff_arrow:
    side: ally
    fps: 4.0
    reference_resolution: [1280, 720]
    y: 43
    h: 16
    dx0: -3                        # 칸의 초상화 x(team.portrait_slots) 기준 영역
    dx1: 37
    white_threshold: 200
    baseline_seconds: 2.5
    window_seconds: 3.0
    min_increase: 0.05
    min_frames: 4
    # 화살표가 없을 때: 직후 아군 초상화가 어두워진 채 유지되면(사망) 효과가 끊긴 것(interrupted)으로 본다.
    # 실측(4분 10초 나노 → 솔저 사망): 해당 칸 밝기 124 → 99 (약 20% 감소), 정상 나노 때는 이런 칸 없음.
    death_y: 46
    death_h: 30
    death_w: 30
    death_hold_seconds: 1.0        # 창 마지막 이 시간 동안 어두운 상태 유지
    death_min_drop: 0.12
  # 수면총 명중: 맞은 적의 팀 목록 칸 초상화 오른쪽 위에 흰 "zz" 표시가 몇 초간 뜬다(사용자 확인).
  # 실측(두 번째 아나 영상 수면총 5회): 명중 3회 해당 칸 2~7프레임·다른 칸 0, 빗나감 2회 모든 칸 0. 화면 확인과 5/5 일치.
  sleep_icon:
    side: enemy
    icon_name: "zz 표시"
    fps: 8.0
    reference_resolution: [1280, 720]
    y: 48
    h: 10
    dx0: 16                        # 칸의 초상화 x(team.portrait_slots) 기준 영역
    dx1: 32
    white_threshold: 200
    baseline_seconds: 1.0
    window_seconds: 3.0
    min_increase: 0.08
    min_frames: 2
  # 치유 차단 대상: 상단 팀 목록에서 이름 아래 체력바 테두리가 보라(자홍)색으로 변함 (사용자 확인).
  # 실측 영상2 22초 수류탄 → 23초부터 기대하지마(모이라)·참깨라면(라마트라) 0.27, 다른 칸 0.
  antiheal_bars:
    fps: 4.0
    reference_resolution: [1280, 720]
    y: 86
    h: 16
    dx0: -33                       # 칸 초상화 x(team.portrait_slots) 기준 체력바 범위
    dx1: 35
    min_ratio: 0.12
    min_seconds: 0.75
    onset_before_seconds: 1.0      # HUD 사용 시각이 실제 투척보다 늦게 잡히는 경우(최대 ~0.6초)
    onset_after_seconds: 2.5
  # 아군 적중: 수류탄에 맞은 아군은 머리 위 체력바 테두리가 노란색 + 노란 '+' (사용자: 노란 빛이면 아군).
  # 실측 영상2 1분 32초 LEAF(윈스턴) 머리 위 체력바. 플레이어 자신은 체력 숫자 왼쪽 아이콘이 노랗게 변함.
  heal_boost:
    fps: 8.0
    reference_resolution: [1280, 720]
    onset_before_seconds: 1.0
    base_seconds: 0.25             # 기준(던지기 전) 프레임: 구간 맨 앞 이 시간만
    onset_after_seconds: 2.0
    world: {y0: 100, y1: 560, min_len: 40, max_len: 140, gap: [7, 12], persist_frames: 2, track_px: 45}   # 실측 체력바 폭 ~80, 테두리 간격 ~9
    self_icon: {x0: 108, y0: 597, x1: 132, y1: 616, min_ratio: 0.25, min_seconds: 0.25}
  # 아군 체력: 상단 팀 목록 이름 아래 체력바에서 채워진 칸(흰 체력·파란 보호막·주황 방어구)이 닿은 위치 / 바 폭. 수류탄 사용 순간 아군에
  # 치명상(critical 이하)이 있었는지 판단 (사용자: 아군 치명상이 없는데 적을 처치하면 최선).
  team_health:
    fps: 2.0
    reference_resolution: [1280, 720]
    y: 94                          # 체력 칸 줄 (5줄)
    h: 5
    above_h: 6                     # 바로 위 줄이 밝으면 체력바가 아님 (사망 X 표시 등)
    max_above: 0.3
    dx0: -31                       # 칸 초상화 x 기준 체력바 범위 (폭 66)
    dx1: 35
    white_threshold: 175
    min_rows: 0.6                  # 한 열이 이 비율 이상 밝아야 채워진 칸
    min_white_cols: 3              # 흰 체력 칸이 이보다 적으면 사망(X 표시)·판독 불가 (실측 사망 칸은 파란 X 조각만)
    critical: 0.30                 # 이 비율 미만이면 치명상
    dead_below: 0.03               # 이보다 낮으면 사망·판독 불가로 제외
    before_seconds: 0.5
  # 화면 속 아군·적 (윤곽선): 아군 색(빨강) 윤곽선 무리 = 아군, 청록 = 적. 얇은 선만, 월드 화면 안만(팀 목록·HUD·가장자리·킬피드 제외).
  # 화면에 아군 없이 적만 min_seconds 이상 보이면 '아군 없이 적과 대치'(사용자 포지셔닝 기준: 아군 후방이 기본).
  screen_presence:
    fps: 2.0
    reference_resolution: [640, 360]
    world: [24, 60, 616, 275]      # x0, y0, x1, y1 (640x360 기준)
    kill_feed: [400, 145]          # 이 x 오른쪽, 이 y 위쪽은 킬피드
    cell: 16
    thin_max: 12                   # 5x5 안의 같은 색 픽셀이 이 이하일 때만 선
    min_cluster: 3
    alone_seconds: 3.0
    alone_share: 0.8               # 그 구간 표본의 이 비율 이상이 '아군 0·적 1 이상'이면 대치 구간 (깜빡이는 한 프레임은 무시)
    # 본대를 등짐/본대가 화면 밖 (코치 영상1 3분 7초: 본대를 바라보면서 화물 쪽으로 가야 함). 카메라 수평 회전량을 화면 폭 단위로
    # 누적(앞뒤 프레임 위상 상관)하고, 아군 윤곽선이 team_min_allies 명 이상 보이던 방향에서 turned_widths 폭 이상 벗어난 채
    # 화면 속 아군이 그보다 적으면 표본 하나. 각도는 시야각 설정에 따라 달라 화면 폭으로만 말한다.
    # 실측(1.0폭): 영상1 1:58-2:00(본대 없이 적 정면), 3:06-3:09(화물 쪽으로 걸으며 본대 등짐), 영상2 4:21-4:28(버스 너머 적 정면).
    # 0.9폭이면 영상1 2:36-2:39 추가, 1.1폭이면 영상1 1:58 빠짐.
    turn:
      fps: 30.0                    # 빠른 180도 회전은 4fps에서 프레임 사이 반 화면 넘게 움직여 놓침(실측 3분 5초)
      reference_resolution: [320, 180]
      region: [10, 25, 300, 85]    # x, y, w, h: 위쪽 월드 화면(먼 배경). 총·HUD·팀 목록 제외
      team_min_allies: 2
      turned_widths: 1.0
      max_gap_seconds: 15.0        # 본대를 마지막으로 본 뒤 이 시간까지만 (누적 회전량은 오래 쌓이면 어긋남)
      min_seconds: 2.5
      share: 0.8
      # 구간의 화면 속 적 수 중앙값이 이 이상이면 '본대 없이 적을 마주함', 아니면 '본대를 등짐' (실측 프레임 확인: 1:58 2명·4:22 2명 = 적 정면, 3:07 1명 = 등짐)
      facing_enemies_min: 2
  # 처치 관여: 화면 중앙 아래 빨간 '해골 + 이름' 표시(내 처치·도움). 실측 영상2 26.5초 참깨라면(라마트라), 수류탄 22초 뒤 4.5초.
  # 누가 죽었는지는 그 순간 팀 목록에서 % 상자 색이 가장 바랜 적 칸(다른 적 칸 대비). 실측 참깨라면 칸 0.48→0.23.
  kill_banner:
    side: enemy
    fps: 4.0
    reference_resolution: [1280, 720]
    window_seconds: 6.0
    banner: {x: 560, y: 495, w: 160, h: 70, min_ratio: 0.05, min_seconds: 1.0}
    slot_box: {y: 48, h: 22, dx0: -40, dx1: -8, after_seconds: 1.5, min_drop: 0.25}   # 칸 초상화 x 기준 % 표시 상자
  # 내 체력 숫자 왼쪽 아이콘: 평소 흰 "+", 치유 차단 중엔 보라색 아이콘 (실측 영상2 36.5~38.9초, 반사된 수류탄)
  self_antiheal:
    icon_name: "치유 차단 아이콘"
    fps: 8.0
    reference_resolution: [1280, 720]
    x0: 112
    y0: 597
    x1: 129
    y1: 616
    min_ratio: 0.3                 # 영역 내 보라 픽셀 비율 (실측: 치유 차단 0.6~0.7, 평소 0)
    min_seconds: 1.0               # 적 궁극기 효과로 잠깐 보라색이 비치는 경우(0.25초 이하 실측) 제외
    onset_before_seconds: 1.0      # HUD 사용 시각이 실제 투척보다 최대 ~0.6초 늦게 잡힘(실측)
    onset_after_seconds: 1.5
  regions:
    ultimate: {shape: circle, cx: 640, cy: 620, r: 22}
    ability_1: {shape: rect, x0: 977, y0: 614, x1: 1011, y1: 648}
    ability_2: {shape: rect, x0: 1030, y0: 614, x1: 1064, y1: 648}

output:
  max_feedback_items: 5            # 일반 피드백 최대 개수 (사망 직전·HUD 확인 궁극기 피드백은 별도, 항상 포함). CLI --max-feedback
  max_action_items: 3
  # 단정적 피드백(assertive)으로 표시하기 위한 최소 확신도
  min_confidence_for_assertive: 0.6
  # true면 코치 검수(approved)된 기준이 적용된 피드백만 단정적으로 표시
  require_approved_criteria_for_assertive: true
  # true면 HUD 대조로 확인된 스킬/궁극기 사용이 1개 이상 있고 불일치가 없는 피드백만 단정적으로 표시
  # (모델이 스스로 매긴 확신도는 첫 실제 실행에서 틀린 항목도 1.0이어서 단정 판정 근거로 부족했음)
  require_hud_verification_for_assertive: true
  # 이 분류의 피드백은 항상 참고·보류로 표시 (코드로 확인할 수단이 없음)
  hold_categories: []          # 포지셔닝 보류 해제 (사용자 포지셔닝 기준 2026-10-15)
  # 이 기준만으로 내린 등급은 '판단 보류'로 바꾼다: 근거(적 대응 스킬 활성)를 코드로 확인할 수 없고, 모델 판단이
  # 실제 영상에서 두 번 다 틀렸다(두 번째 아나 영상: 36초 튕겨내기 놓침, 2분 17초 없는 튕겨내기 반사를 지어냄).
  unverifiable_criteria: [common.skill.no_skills_into_deflect]
  # 코드가 반사(자신에게 치유 차단)를 확인한 스킬 피드백은 블런더로 하고 이 기준을 근거로 붙인다
  reflected_criterion: common.skill.no_skills_into_deflect
  # 탁월·최선·블런더는 인용한 기준의 좋은/나쁜 신호 문구(matched_sign)가 있어야 인정. 없으면 판단 보류
  # (실측: 첫 아나 영상에서 그냥 던진 수류탄까지 '최선'. 코치는 1분 35초·2분 51초를 '그냥 던짐'·'아쉽'이라고 함)
  require_matched_sign: true
  # 포지셔닝 최선·탁월은 이 길이(초) 이내의 특정 순간에만. 장면 전체를 '엄폐하며 생존'으로 묶은 판정은 보류
  # (실측: 첫 아나 영상에서 30초 장면마다 최선. 코치는 1분 28초·2분 30초·3분 7초에 각각 문제를 짚음)
  positioning_max_graded_seconds: 15
  # 무력화 스킬(수면총 등)을 쓴 뒤 이 시간 안에 플레이어가 죽으면, 그 사용을 근거로 한 최선·탁월 판정은 보류한다
  # (명중했다면 대상이 행동하지 못함). 실측: 2분 17초 수면총을 '명중'으로 판단했으나 빗나갔고 1.5초 뒤 사망.
  disable_then_death_seconds: 3.0
  # 같은 카테고리에서 시간 구간이 이 비율 이상 겹치면 중복으로 간주
  dedup_overlap_ratio: 0.5
  # 모델이 제시한 시간이 분석한 구간 밖으로 벗어나도 허용하는 오차(초)
  window_tolerance_seconds: 1.0

provider:
  name: gemini                     # gemini | mock
  temperature: 0.2
  # 장면별 포지셔닝·필수 스킬 피드백이 빠지면 빠진 것을 알려 이 횟수만큼 다시 요청 (실측: 한 실행에서 포지셔닝 전부 누락)
  coverage_retries: 1
  file_poll_interval_seconds: 3
  file_poll_timeout_seconds: 600
  delete_uploaded_files: true      # 분석 후 Gemini Files API에서 업로드 파일 즉시 삭제
  max_retries: 6                   # 429/5xx 재시도 횟수
  # 재시도 대기: retry_base_seconds × 2^(시도 번호), 최대 retry_max_wait_seconds.
  # 기본값이면 2·4·8·16·32·60초(총 약 2분) — 503 "high demand" 같은 일시적 과부하가 지나갈 시간을 준다.
  retry_base_seconds: 1
  retry_max_wait_seconds: 60
  json_repair_retries: 1           # 스키마 불일치 응답 재요청 횟수
