# 분석 파이프라인 설정. 모든 값은 코드 기본값 없이 여기서 관리한다.
# 이 파일의 내용(및 프롬프트/영웅 기준 버전)은 단계별 캐시 지문(fingerprint)에 포함되므로,
# 값을 바꾸면 영향을 받는 단계만 다시 실행된다.
pipeline_version: "0.1.0"

input:
  max_duration_seconds: 300        # 초기 범위: 최대 5분
  min_width: 1280                  # HUD 판독을 위한 최소 해상도
  min_height: 720
  max_file_size_mb: 2000
  allowed_extensions: [".mp4", ".mov", ".mkv", ".webm"]

preprocess:
  # 전체 흐름 분석용 업로드 사본(proxy). 원본과 타임라인이 동일하도록 자르지 않고 재인코딩만 한다.
  proxy:
    enabled: true
    max_height: 720
    crf: 28
    fps: 30
  evidence_frame_max_width: 1280   # 근거 프레임 JPEG 최대 폭

# 팀 판별: 영상 전체(저해상도)로는 상단 팀 목록의 작은 글씨를 읽지 못해 이름을 지어내는 문제가 있어(실측),
# 원본에서 몇 장의 프레임을 골라 팀 목록·플레이어 HUD·킬피드 영역만 잘라 확대한 이미지로 따로 판독한다.
team:
  enabled: true
  frame_fractions: [0.35, 0.65]    # 영상 길이의 이 비율 시각 프레임 사용 (대기실·처치 화면을 피하려고 중간 구간)
  upscale: 2
  media_resolution: MEDIA_RESOLUTION_HIGH
  # 영웅은 모델이 아니라 코드가 판독한다: 팀 목록 초상화를 참고 초상화와 이미지 대조(owcoach/portraits.py).
  # 모델은 초상화 참고표를 줘도 MMG(독트린)를 실행마다 마우가/솜브라로 high 확신도로 답했다(실측).
  portraits: config/hero_portraits/portraits.yaml
  portrait_slots:                  # 팀 목록 초상화 영역 (1280x720, 숫자 % 표시를 피한 오른쪽 부분)
    y: 49
    h: 24
    w: 30
    left_x: [63, 133, 203, 273, 343]
    right_x: [935, 1005, 1075, 1145, 1215]
    # 초상화 대조용 프레임(영상 길이 비율). 사망 등으로 초상화가 흐려진 프레임이 있어 여러 장에서 가장 잘 맞는 점수를 쓴다.
    frame_fractions: [0.15, 0.3, 0.45, 0.6, 0.75, 0.9]
    scale_min: 0.30                # 참고 초상화 축소 배율 탐색 범위 (실측 최적 0.34~0.36)
    scale_max: 0.40
    scale_step: 0.02
    thresholds:                    # 실측: 정답 0.77~0.93, 2위 0.46~0.68
      high_score: 0.75
      high_margin: 0.15
      min_score: 0.6
      min_margin: 0.05             # 이보다 2위와 차이가 작으면 '불명'
  reference_resolution: [1280, 720]
  regions:                         # 1280x720 기준 x, y, w, h
    team_lists: {x: 0, y: 0, w: 1280, h: 110}
    player_hud: {x: 0, y: 570, w: 340, h: 150}
    kill_feed: {x: 900, y: 90, w: 380, h: 130}

overview:
  # 전체 영상에서 모델이 받는 초당 프레임 수(샘플링 간격 = 1/fps 초). Gemini 허용 범위 (0, 24]
  fps: 1.0
  media_resolution: null           # null이면 API 기본값. 예: MEDIA_RESOLUTION_LOW / MEDIUM / HIGH
  max_candidates: 8                # 상세 분석으로 넘길 후보 장면 최대 개수

detail:
  pre_seconds: 8.0                 # 후보 장면 시작 전 추가 분석 범위
  post_seconds: 4.0                # 후보 장면 종료 후 추가 분석 범위
  fps: 4.0                         # 후보 구간 재분석 샘플링
  media_resolution: null
  merge_gap_seconds: 2.0           # 확장된 구간끼리 이 간격 이하로 붙어 있으면 하나로 합침
  max_window_seconds: 40.0         # 합친 구간의 최대 길이

coaching:
  temperature: 0.2

# 플레이어 사망 직전 상황은 모델이 후보로 고르지 않아도 반드시 분석한다.
# 사망 시각 = (좌하단 체력 칸 10개가 min_seconds 이상 모두 비어 있는(체력 0) 구간의 시작) + (overview 타임라인에서
# model_keywords 가 들어간 사건). 사망 중에도 HUD는 그대로 보이고(사망 위치에서 관전), 체력 칸이 비고
# 초상화에 빨간 해골이 뜬다. 실측(두 번째 영상): 체력 0 구간 5번, 각 11~14초(부활 대기), 첫 영상은 0번.
# 사망마다 [사망 - pre_seconds, 사망] 구간을 상세 분석 장면에 넣고, 코칭 단계는 그 구간 피드백을 최소 1개 쓴다.
death_check:
  enabled: true
  pre_seconds: 10.0
  health_bar:
    reference_resolution: [1280, 720]
    x0: 114
    y0: 619
    x1: 278
    y1: 638
    white_threshold: 200
    empty_ratio: 0.03               # 흰 체력 칸 비율이 이 미만이면 체력 0 (실측: 살아 있을 때 최소 0.10)
    fps: 2.0
    min_seconds: 3.0
  # 모델이 기록한 사망이 체력 0 구간(사망~부활) 안이거나 그 앞뒤 이 시간 안이면 같은 사망으로 합친다
  merge_seconds: 5.0
  model_keywords: ["사망", "처치당", "죽음", "부활 대기", "리스폰 대기"]

# 모델이 말한 스킬/궁극기 사용을 HUD 픽셀로 대조 (AI 없음). owcoach/hud.py 참고.
# 슬롯별 "준비됨(흰 타일/원판)" vs "쿨다운/충전 중" 상태만 판별한다. 숫자(쿨다운 초, 궁극기 %)는 읽지 않는다.
# 좌표는 기본 HUD 배치·HUD 크기 100%의 1280x720 기준. 실제 영상 1개(1280x720 녹화)로만 보정되었으므로
# 다른 해상도 비율/HUD 설정에서는 영역을 다시 확인해야 한다.
hud_check:
  enabled: true
  fps: 4.0                         # 장면 구간 HUD 샘플링
  reference_resolution: [1280, 720]
  white_threshold: 185             # RGB 최솟값이 이 값을 넘으면 '흰 픽셀'
  ready_ratio: 0.5                 # 영역 내 흰 픽셀 비율이 이 이상이면 준비 상태 (실측: 준비 0.70~0.87, 쿨다운 0.06~0.20)
  # 스킬 칸 흰 비율이 이 미만이면 그 칸은 판독 불가(쿨다운 종료 순간 칸이 깜빡임. 실측 쿨다운은 0.05 이상),
  # 스킬 칸이 모두 이 미만이면 HUD 가려짐(사망 화면 등)으로 보고 궁극기도 판단하지 않음
  hidden_ratio: 0.03
  hidden_check_slots: [ability_1, ability_2]
  # 이 횟수 연속 같은 상태일 때만 상태로 인정. 궁극기 원판 영역은 밝은 배경·섬광으로 최대 약 1.25초
  # 흰색이 되는 경우가 있어(실측) 준비 상태를 2초(8회) 이상 유지할 때만 인정한다.
  min_run_samples: {default: 2, ultimate: 8}
  search_seconds: 2.5              # 모델이 말한 시각 ±이 범위에서 준비→사용 전환을 찾음
  # 강화형 스킬(나노 강화제) 대상: 받은 아군의 팀 목록 칸 초상화 위에 흰 위쪽 화살표가 몇 초간 올라간다.
  # 사용 직후 window_seconds 동안 각 아군 칸 초상화 윗부분의 흰 픽셀 비율이 직전 baseline 대비
  # min_increase 이상 오른 프레임을 세어, min_frames 이상이고 2위의 2배 이상인 칸을 대상으로 본다.
  # 실측(136초 나노 → 목포산아이): 대상 칸 12프레임 중 9, 다른 칸 0~1.
  buff_arrow:
    fps: 4.0
    reference_resolution: [1280, 720]
    y: 43
    h: 16
    dx0: -3                        # 칸의 초상화 x(team.portrait_slots) 기준 영역
    dx1: 37
    white_threshold: 200
    baseline_seconds: 2.5
    window_seconds: 3.0
    min_increase: 0.05
    min_frames: 4
    # 화살표가 없을 때: 직후 아군 초상화가 어두워진 채 유지되면(사망) 효과가 끊긴 것(interrupted)으로 본다.
    # 실측(4분 10초 나노 → 솔저 사망): 해당 칸 밝기 124 → 99 (약 20% 감소), 정상 나노 때는 이런 칸 없음.
    death_y: 46
    death_h: 30
    death_w: 30
    death_hold_seconds: 1.0        # 창 마지막 이 시간 동안 어두운 상태 유지
    death_min_drop: 0.12
  regions:
    ultimate: {shape: circle, cx: 640, cy: 620, r: 22}
    ability_1: {shape: rect, x0: 977, y0: 614, x1: 1011, y1: 648}
    ability_2: {shape: rect, x0: 1030, y0: 614, x1: 1064, y1: 648}

output:
  max_feedback_items: 5
  max_action_items: 3
  # 단정적 피드백(assertive)으로 표시하기 위한 최소 확신도
  min_confidence_for_assertive: 0.6
  # true면 코치 검수(approved)된 기준이 적용된 피드백만 단정적으로 표시
  require_approved_criteria_for_assertive: true
  # true면 HUD 대조로 확인된 스킬/궁극기 사용이 1개 이상 있고 불일치가 없는 피드백만 단정적으로 표시
  # (모델이 스스로 매긴 확신도는 첫 실제 실행에서 틀린 항목도 1.0이어서 단정 판정 근거로 부족했음)
  require_hud_verification_for_assertive: true
  # 이 분류의 피드백은 항상 참고·보류로 표시 (코드로 확인할 수단이 없음)
  hold_categories: [positioning]
  # 같은 카테고리에서 시간 구간이 이 비율 이상 겹치면 중복으로 간주
  dedup_overlap_ratio: 0.5
  # 모델이 제시한 시간이 분석한 구간 밖으로 벗어나도 허용하는 오차(초)
  window_tolerance_seconds: 1.0

provider:
  name: gemini                     # gemini | mock
  temperature: 0.2
  file_poll_interval_seconds: 3
  file_poll_timeout_seconds: 600
  delete_uploaded_files: true      # 분석 후 Gemini Files API에서 업로드 파일 즉시 삭제
  max_retries: 6                   # 429/5xx 재시도 횟수
  # 재시도 대기: retry_base_seconds × 2^(시도 번호), 최대 retry_max_wait_seconds.
  # 기본값이면 2·4·8·16·32·60초(총 약 2분) — 503 "high demand" 같은 일시적 과부하가 지나갈 시간을 준다.
  retry_base_seconds: 1
  retry_max_wait_seconds: 60
  json_repair_retries: 1           # 스키마 불일치 응답 재요청 횟수
